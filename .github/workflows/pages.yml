# Publish the phone app to GitHub Pages.
#
# One-time setting: repository Settings → Pages → Build and deployment →
# Source: GitHub Actions. Then every push to main redeploys, and the app is
# served at the Pages URL with the demo at /demo/.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What deploy-pages needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should supersede one still in flight, never interleave with it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build _site
        run: node build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
