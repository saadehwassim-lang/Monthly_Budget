  A fallback, not the app.

  /app/ and this sends you there rather than showing a 404.
-->

  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f5;color:#55555f;
       font:16px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif}
  a{color:#2a78d6}
  @media (prefers-color-scheme:dark){body{background:#0e0e0d;color:#b2b2ac}a{color:#3987e5}}
</style>
<p>Opening the app… <a href="./app/">continue</a></p>
